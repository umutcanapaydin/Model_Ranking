# Gitleaks configuration.
# Seed F.6: secret scanning is non-optional.
# Used by `make secrets` (a leg of `make gate`, so the pre-push hook and /pre-merge run it) and by
# the `secret-scan` job in .github/workflows/ci.yml.

title = "Default secret-scan config"

# Use the default ruleset bundled with gitleaks. To extend, add `[[rules]]` below.
[extend]
useDefault = true

# Allowlist common false-positive patterns (be conservative — false negatives
# are catastrophic). Adjust per project; a path exemption is a waiver, so add one only for a
# directory that exists, with its reason.
[allowlist]
description = "Allowlist false positives"
paths = [
  '''(?i)^.*\.env\.example$''',   # template files
]

# Common test-fixture API key prefixes that gitleaks would otherwise flag:
regexes = [
  '''sk-test-[a-zA-Z0-9]{20,}''',     # Stripe test mode
  '''dummy-[a-zA-Z0-9_-]{12,}''',     # dummy / placeholder tokens
  # W-001, owner-ratified 2026-08-17 after surviving four milestone closes.
  # gitleaks' `generic-api-key` rule reads an ADR compliance label that follows the word "APIs"
  # in prose as a key VALUE. Zero entropy, present since the M2 commit, and self-propagating:
  # every record that documented the finding re-triggered it by naming the shape.
  # Scoped to the LABEL SHAPE, deliberately NOT to a path — `docs/reviews/**` must keep being
  # scanned, because those files quote real tooling output and are where a real leak would land.
  '''D-\d{3}-compliant''',
]

# To add a project-specific rule, append:
# [[rules]]
#   id = "my-project-app-code"
#   description = "Customer AppCode token format"
#   regex = '''<your-regex>'''
#   tags = ["secret", "appcode"]
