# PROPOSAL — M6-W4, not yet adopted. D-116 names Fly.io as the target; this file is what that would
# look like, for the owner's review. K.10 cross-team surface; see `.github/CODEOWNERS`.
#
# NOT A DEPLOY AUTHORISATION. D-116 states it explicitly: W-017 — the serving snapshot copies the
# whole database into memory per unauthenticated request, measured at ~9,100x amplification at
# today's size — is BLOCKING at Stage 4.3, and the closure pass must re-derive that number
# independently before any first deploy.

app = "model-ranking"
primary_region = "fra"

[build]
  # APP_BUILD is supplied at build time so /health can answer "which code is live" (L.7).
  [build.args]
    APP_BUILD = "set-me-to-the-git-sha"

[env]
  APP_ENV = "production"
  MODEL_RANKING_DB = "/data/advisor.db"
  # W-017 conditions (a) and (c), declared here so the VM below and the process agree. The app
  # derives its maximum servable database size from these two numbers and REFUSES TO BOOT past it,
  # so a data refresh that outgrows the machine fails at deploy rather than under load.
  MODEL_RANKING_MAX_CONCURRENCY = "8"
  MODEL_RANKING_MEMORY_BUDGET_MB = "256"

# W-017 condition (b): the VM size is DECLARED. It was absent, which meant Fly's 256 MB default —
# a number nobody had chosen while `hard_limit = 8` was being described as "W-017's containment".
# The three numbers are now one arithmetic: 8 requests x ~2.2x RSS x the database file must fit in
# `memory`, and `max_database_bytes()` in the app is that same expression solved for the file.
# Raising this without raising MODEL_RANKING_MEMORY_BUDGET_MB buys nothing; lowering it without
# lowering the budget lets the process boot into a machine it can exhaust.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[mounts]]
  source = "model_ranking_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Deliberately not scaling to zero: the first request after a cold start would pay the snapshot
  # cost W-017 records, which is the one cost this service should not pay on a user's latency.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    # This is the EDGE half of the cap; the process half is `MODEL_RANKING_MAX_CONCURRENCY` above,
    # applied to AnyIO's thread limiter at startup. Before Stage 4.0 only this half existed and the
    # process was quietly running AnyIO's default of 40 — so the file asserted a containment the
    # code was not honouring. `hard_limit` must equal MODEL_RANKING_MAX_CONCURRENCY; the app's
    # budget arithmetic assumes it.
    type = "requests"
    soft_limit = 4
    hard_limit = 8

[checks.health]
  type = "http"
  port = 8080
  method = "get"
  path = "/health"
  interval = "30s"
  timeout = "5s"
