# The hosted engine on Fly.io (D-116, the owner's choice; M19-W5, the first release). A K.10 deploy
# surface: the owner reviews each change (AGENTS.md §5).
#
# NOT A DEPLOY AUTHORISATION: the owner deploys, with `scripts/deploy_hosted_engine.sh`, after the
# Stage 5.1 security review. W-017 is CLOSED (M7-W3): the serving snapshot that copied the whole
# database into memory per request was deleted, and the process reads the artifact directly
# (measured: 30 requests grew peak RSS by 0.64 MiB over a 0.93 MiB database).
#
# `app` names the deployment and, with it, the one Host the engine answers to (below). Fly app names
# are global: if this one is taken, rename it in four places together: `app`,
# MODEL_RANKING_ALLOWED_HOSTS and the health check's Host here, and ENGINE_URL[config=Release] in
# ios/Config/Engine.xcconfig (docs/release-testflight.md, step 1.3).

app = "model-ranking"
primary_region = "fra"

[build]
  # The stage that carries the public artifact inside the image (no volume to start empty). APP_BUILD
  # is passed by the deploy script from the commit; with none, production refuses to boot (L.7).
  build-target = "hosted"

[env]
  APP_ENV = "production"
  MODEL_RANKING_DB = "/srv/advisor.db"
  # #94: the engine binds every interface in the image, so it answers only to this Host (D-171).
  MODEL_RANKING_ALLOWED_HOSTS = "model-ranking.fly.dev"
  # Concurrency is DECLARED rather than inherited: sync handlers run on AnyIO's thread pool, whose
  # default of 40 is a number nobody in this project chose. `hard_limit` below must equal it.
  MODEL_RANKING_MAX_CONCURRENCY = "8"

# The VM size stays DECLARED rather than defaulted: measured resident use is ~62 MiB serving a
# 0.93 MiB database, and it grows with SQLite's page cache rather than with request count.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine always up: a phone's first question should not wait for a cold start.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    # This is the EDGE half of the cap; the process half is `MODEL_RANKING_MAX_CONCURRENCY` above,
    # applied to AnyIO's thread limiter at startup. `hard_limit` must equal
    # MODEL_RANKING_MAX_CONCURRENCY; the app's budget arithmetic assumes it.
    type = "requests"
    soft_limit = 4
    hard_limit = 8

  # The check reaches the machine by its address, which the Host list refuses (400), so it names the
  # deployment's Host as a phone does.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
    [http_service.checks.headers]
      Host = "model-ranking.fly.dev"
