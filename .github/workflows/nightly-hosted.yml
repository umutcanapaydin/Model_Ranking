# The hosted engine's night (#387, D-217): refresh on a runner, deploy to Fly.io, with no Mac.
#
# THE AGENT'S PROPOSAL. The installed copy is `.github/workflows/nightly-hosted.yml`, the owner's to apply
# (AGENTS.md section 3): `cp scripts/ci/nightly-hosted.yml .github/workflows/`. tests/unit/test_nightly_hosted.py
# holds this file's shape, and holds the installed copy equal to it once it exists.
#
# Three jobs; only `deploy` holds a secret (D-217 clause 2), and only `notice` may write issues (D-243):
#   refresh  fetches and parses every source, builds the artifact, and keeps it as `hosted-state` for the
#            next night's carry-forward (D-156); then derives the public copy and its stamp, `hosted-public`.
#            No secret; the checkout keeps no credential; the token that reads the previous state reaches
#            only that step.
#   deploy   never fetches a source and never opens a database (#389): it takes `hosted-public`, runs the
#            deploy gate, and ships the copy as it is, checked against its stamp, when /health does not
#            already answer it (`scripts/nightly_hosted.sh deploy`). It installs no package.
#            It runs in the `fly-production` environment, which only `main` may deploy from, and the token
#            is that environment's secret, never the repository's: a run dispatched on another branch
#            cannot reach it (the #387 security review's B1).
#   notice   opens one issue for the sources silent for 7 or more nights, or comments on the open one
#            (D-243 clause 2). It holds `issues: write` and nothing else, checks nothing out and uses no
#            action; its title is fixed here, and only the body comes from the refresh (#580 R2).
# Every job runs only on main.
# A failed night uploads and deploys nothing: Fly keeps serving the last good image, the last good state stands.
name: nightly-hosted

on:
  schedule:
    - cron: '30 21 * * *'  # 00:30 in Istanbul; GitHub may start a scheduled run late
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-hosted
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45  # the cycle ends itself at 27 minutes (D-154)
    permissions:
      contents: read
      actions: read
    outputs:
      outcome: ${{ steps.night.outputs.outcome }}
      silent: ${{ steps.silent.outputs.notice }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install (D-177, the locks the Mac's engine service installs)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q --require-hashes -r requirements/ingest.lock -r requirements/build.lock
          .venv/bin/python -m pip install -q --no-deps --no-build-isolation -e .
      - name: Fetch the last good night's state
        # Only this workflow's own runs on main, started by the schedule or by hand, from this file,
        # whose commit is on main, are read: a pull request's run, a fork's included, can upload an
        # artifact of the same name, and a run dispatched on a tag named `main` names that branch.
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ runner.temp }}/state
        run: |
          mkdir -p "$STATE"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly-hosted.yml/runs?branch=main&per_page=40" \
            --jq '.workflow_runs[] | select((.event == "schedule" or .event == "workflow_dispatch")
                    and .head_repository.full_name == env.GITHUB_REPOSITORY
                    and .path == ".github/workflows/nightly-hosted.yml") | "\(.id) \(.head_sha)"')
          printf '%s\n' "$runs" | while read -r run sha; do
            [ -n "$run" ] && [ "$run" != "$GITHUB_RUN_ID" ] || continue
            on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status) || continue
            case "$on_main" in identical|ahead) ;; *) continue ;; esac
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '[.artifacts[] | select(.name == "hosted-state" and .expired == false)][0].id // empty')
            if [ -n "$id" ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/state.zip"
              unzip -o -q "$RUNNER_TEMP/state.zip" advisor.db advisor.db.refresh.json -d "$STATE"
              rm -f "$RUNNER_TEMP/state.zip"
              echo "the state of run $run"
              exit 0
            fi
          done
          [ -f "$STATE/advisor.db" ] || echo "::notice::no kept state: tonight is a first publish"
      - name: The night's refresh
        id: night
        run: scripts/nightly_hosted.sh refresh "$RUNNER_TEMP/state"
      - name: Keep the state for the next night
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hosted-state
          path: |
            ${{ runner.temp }}/state/advisor.db
            ${{ runner.temp }}/state/advisor.db.refresh.json
          retention-days: 90
          if-no-files-found: error
      - name: The public copy and its stamp
        run: scripts/nightly_hosted.sh prepare "$RUNNER_TEMP/state"
      - name: Hand the public copy to the deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hosted-public
          path: |
            build/hosted/advisor.db
            build/hosted/build.txt
          retention-days: 1
          if-no-files-found: error
      - name: The sources silent for 7 or more nights (D-243)
        # Last, and on a failed or refused night too: a night that serves nothing new is when a source's
        # silence grows. It never fails the job, so it never holds the deploy back.
        id: silent
        if: ${{ !cancelled() }}
        continue-on-error: true  # #580 M1: under bash -e a failure here would skip the deploy
        run: |
          record="$RUNNER_TEMP/state/advisor.db.refresh.json"
          if python3 scripts/silent_sources.py --issue "$record" > "$RUNNER_TEMP/silent.json"; then
            python3 scripts/silent_sources.py "$record"
            echo "notice=$(cat "$RUNNER_TEMP/silent.json")" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the silent sources could not be read from the refresh record (D-243)"
          fi

  notice:
    # D-243 clause 2: one issue for the silent sources, opened once and commented on each night after, so a
    # silence that lasts is one issue. Its own job: the refresh job's token never holds `issues: write`.
    needs: refresh
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.refresh.outputs.silent != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open the silent-sources issue, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          NOTICE: ${{ needs.refresh.outputs.silent }}
        run: |
          # #580 R2: the title and every other field are fixed here; only the body comes from the refresh
          printf '%s\n' "$NOTICE" | jq -r '.body' > "$RUNNER_TEMP/notice.md"
          title='Sources silent for 7 or more nights'
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --author app/github-actions \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/notice.md"
            echo "commented on issue #$open"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/notice.md"
            echo "opened the silent-sources issue"
          fi

  deploy:
    needs: refresh
    if: >-
      github.ref == 'refs/heads/main' &&
      (needs.refresh.outputs.outcome == 'published' || needs.refresh.outputs.outcome == 'unchanged')
    environment: fly-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: An interpreter with no packages (the gate and the stamp need only the standard library)
        run: python -m venv .venv
      - name: Take tonight's public copy
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: hosted-public
          path: build/hosted
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be  # 1.5
        with:
          version: 0.4.111  # the binary that receives the token is pinned (the #387 review's M5)
      - name: Put fly on the PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          command -v fly >/dev/null || ln -s "$(command -v flyctl)" "$RUNNER_TEMP/bin/fly"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: The night's deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: scripts/nightly_hosted.sh deploy build/hosted
