# Contract tests vs LIVE data sources (REQ-CI-001, M2).
#
# WHY a separate workflow: the default suite is network-free by rule
# (permission-matrix §3); these tests hit the real LiteLLM / SWE-bench /
# Aider / OpenRouter / Arena endpoints and exist to catch SOURCE SHAPE DRIFT
# early — the build sandbox cannot reach HF/OpenRouter, so CI is the
# canonical place they run (m2-plan §0).
#
# Hardening mirrors ci.yml: least-privilege token, timeout, concurrency
# cancel. K.10: changes to this file are owner-review surface.

name: contract-tests

on:
  workflow_dispatch: {}        # run on demand from the Actions tab
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC — weekly source-drift probe

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # REQ-SUB-004 (M3-W2, owner Q4): the weekly cron doubles as the plan-table
  # re-verification reminder. A stale curated row FAILS this job — the failure
  # IS the reminder, wired to a consumer (v4.3 doctrine: a warning nothing
  # consumes has not warned). Independent of the network-gated job below:
  # staleness needs no external endpoint, so it can never hide behind a
  # source outage.
  plan-staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 — SHA-pinned (M3-W3, carried debt)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 — SHA-pinned (M3-W3)
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Curated plan table within staleness window (REQ-SUB-004)
        run: python -m app.workflows.plans --check-staleness data/plans.yaml
      # M4-W2: the provider rosters carry their OWN verification clock (REQ-ING-009),
      # so they get their own red light — a stale roster is a stale answer.
      - name: Provider rosters within staleness window (REQ-ING-009)
        run: python -m app.workflows.rosters --check-staleness data/rosters.yaml
      # M5-W4: Epoch acquisition has its OWN clock. This does not age benchmark
      # evidence; selected rows keep evaluation-date/undated semantics.
      - name: Epoch bundle acquisition within staleness window (REQ-ING-010)
        run: python -m app.workflows.epoch --check-staleness data/epoch-source.yaml

  live-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 — SHA-pinned (M3-W3, carried debt)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 — SHA-pinned (M3-W3)
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Live contract tests (source shape drift probe)
        env:
          RUN_CONTRACT_TESTS: "1"
        run: pytest tests/integration -v
      # M7-W1: this step used to BE the pipeline — a ~30-line heredoc that was the only place this
      # project's evidence database was ever built. It was invisible to ruff, mypy, pytest and
      # coverage, it wrote to a throwaway file, and this workflow's Monday cron never fired, so it
      # had never run. That is why advisor.db sat on the pre-M5 schema (W-023): nothing rebuilt it.
      # The pipeline now lives in src/app/workflows/build.py with tests. This step INVOKES it.
      - name: Build the evidence database through the real entry point (REQ-ING-012)
        env:
          RUN_CONTRACT_TESTS: "1"
        # Exit 3 is EXPECTED here and is not a failure: a CI runner has no Epoch bundle (D-101
        # makes it an owner-placed artifact), so agentic-coding's evidence is absent by design and
        # `main()` correctly reports "built but not fully servable". Exit 0 is also fine. Only 2 --
        # a real build failure -- fails the job.
        #
        # The first version of this step just ran the command, which meant it returned 3 on every
        # run, forever, and the three steps below it never executed. Three review seats found that
        # independently: this wave replaced an unrun step with an unpassable one, and a permanently
        # red step is how a `continue-on-error` gets added later (V4C-13).
        run: |
          set -o pipefail
          python -m app.workflows.build --db ci_advisor.db | tee build-report.json
          code=${PIPESTATUS[0]}
          if [ "$code" = "3" ]; then
            echo "::notice::built with degraded evidence (expected on a runner: no Epoch bundle)"
            python -c "import json;[print('  ACTION:',a) for a in json.load(open('build-report.json'))['required_operator_actions']]"
          elif [ "$code" != "0" ]; then
            echo "::error::build failed with exit $code"
            exit "$code"
          fi
      - name: Plan coverage + source health report (REQ-SUB-005 / REQ-ING-011)
        run: |
          set -o pipefail
          python -m app.workflows.coverage --db ci_advisor.db | tee coverage-report.json
      - name: Recommend smoke (both tasks + subscription, real data)
        run: |
          set -o pipefail  # a recommend failure must fail the step, not vanish behind head
          # M7-W1: these three lines passed `sinirsiz`, `dusuk` and `orta` until this wave. D-118
          # made the budget vocabulary English in M6 and every one of these would have been
          # rejected by BUDGETS on the first line — but this workflow has never run, so the drift
          # sat here unseen. Same file, same defect, same milestone-defining lesson: an unrun step
          # does not hold still, it rots.
          python -m app.workflows.recommend --db ci_advisor.db --budget unlimited --task coding | head -40
          python -m app.workflows.recommend --db ci_advisor.db --budget low --task assistant | head -40
          # M3 REQ-REC-007 live half: three plan answers from real benchmark data
          python -m app.workflows.recommend --db ci_advisor.db --budget medium --task coding --subscription | head -60
