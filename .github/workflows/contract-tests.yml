# Contract tests vs LIVE data sources (REQ-CI-001, M2).
#
# WHY a separate workflow: the default suite is network-free by rule
# (permission-matrix §3); these tests hit the real LiteLLM / SWE-bench /
# Aider / OpenRouter / Arena endpoints and exist to catch SOURCE SHAPE DRIFT
# early — the build sandbox cannot reach HF/OpenRouter, so CI is the
# canonical place they run (m2-plan §0).
#
# Hardening mirrors ci.yml: least-privilege token, timeout, concurrency
# cancel. K.10: changes to this file are owner-review surface.

name: contract-tests

on:
  workflow_dispatch: {}        # run on demand from the Actions tab
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC — weekly source-drift probe

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # REQ-SUB-004 (M3-W2, owner Q4): the weekly cron doubles as the plan-table
  # re-verification reminder. A stale curated row FAILS this job — the failure
  # IS the reminder, wired to a consumer (v4.3 doctrine: a warning nothing
  # consumes has not warned). Independent of the network-gated job below:
  # staleness needs no external endpoint, so it can never hide behind a
  # source outage.
  plan-staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 — SHA-pinned (M3-W3, carried debt)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 — SHA-pinned (M3-W3)
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Curated plan table within staleness window (REQ-SUB-004)
        run: python -m app.workflows.plans --check-staleness data/plans.yaml
      # M4-W2: the provider rosters carry their OWN verification clock (REQ-ING-009),
      # so they get their own red light — a stale roster is a stale answer.
      - name: Provider rosters within staleness window (REQ-ING-009)
        run: python -m app.workflows.rosters --check-staleness data/rosters.yaml

  live-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 — SHA-pinned (M3-W3, carried debt)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 — SHA-pinned (M3-W3)
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Live contract tests (source shape drift probe)
        env:
          RUN_CONTRACT_TESTS: "1"
        run: pytest tests/integration -v
      - name: End-to-end live pipeline smoke (reachable sources)
        env:
          RUN_CONTRACT_TESTS: "1"
        run: |
          python - <<'EOF'
          import sqlite3
          from app.clients.litellm import LiteLLMClient
          from app.clients.openrouter import OpenRouterClient
          from app.clients.swebench import SweBenchClient
          from app.clients.aider import AiderClient
          from app.clients.arena import ArenaClient
          from app.workflows.schema import DDL
          from app.workflows.ingest import (
              RunContext, ingest_litellm, ingest_openrouter,
              ingest_swebench, ingest_aider, ingest_arena,
          )
          from app.workflows.registry import reconcile, reconcile_plans
          from app.workflows.plans import ingest_plans
          from app.workflows.rosters import ingest_rosters

          conn = sqlite3.connect("ci_advisor.db"); conn.executescript(DDL)
          run = RunContext()
          # M3: curated plan table joins the live pipeline (REQ-SUB-002)
          with open("data/plans.yaml", encoding="utf-8") as fh:
              pr = ingest_plans(conn, fh.read(), run)
          print(f"{pr.source}: stored={pr.stored}")
          with open("data/rosters.yaml", encoding="utf-8") as fh:
              rr = ingest_rosters(conn, fh.read(), run)
          print(f"{rr.source}: stored={rr.stored} skipped={rr.skipped}")
          assert rr.stored > 0, "roster ingest stored nothing — a printed zero is not a pass"
          for fn, client in (
              (ingest_litellm, LiteLLMClient()),
              (ingest_openrouter, OpenRouterClient()),
              (ingest_swebench, SweBenchClient()),
              (ingest_aider, AiderClient()),
              (ingest_arena, ArenaClient()),
          ):
              r = fn(conn, client, run)
              print(f"{r.source}: stored={r.stored} skipped={r.skipped} health={r.health}")
          rep = reconcile(conn)
          print(f"reconcile: {rep.pricing_matched}/{rep.pricing_dropped} pricing, "
                f"{rep.scores_matched}/{rep.scores_dropped} scores, models={rep.models_registered}")
          assert rep.models_registered >= 20, "live reconciliation collapsed — registry drift?"
          prep = reconcile_plans(conn)
          print(f"reconcile_plans: matched={prep.matched} dropped={prep.dropped} "
                f"dropped_names={list(prep.dropped_names)}")
          conn.commit()
          EOF
      - name: Recommend smoke (both tasks + subscription, real data)
        run: |
          set -o pipefail  # a recommend failure must fail the step, not vanish behind head
          python -m app.workflows.recommend --db ci_advisor.db --budget sinirsiz --task coding | head -40
          python -m app.workflows.recommend --db ci_advisor.db --budget dusuk --task assistant | head -40
          # M3 REQ-REC-007 live half: three plan answers from real benchmark data
          python -m app.workflows.recommend --db ci_advisor.db --budget orta --task coding --subscription | head -60
