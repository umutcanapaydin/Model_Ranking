name: CI

# Pipeline v2.0 — Layer 1 (Pure CI) per consortium 3-layer model.
# Hardened YAML per DevOps lens: least-privilege token, timeout, concurrency cancel,
# dependency cache, pinned action SHAs (replace @v4-style refs with SHAs before going live).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level: read-only by default. Each job expands ONLY what it needs.
permissions:
  contents: read

jobs:
  # W-025: the OWNER's out-of-sandbox run is the authoritative one under A0.5, and it happens on
  # Python 3.14 while CI covered only 3.12 and 3.11. Nothing was violated -- `requires-python` is
  # ">=3.11" on purpose -- but the one interpreter the deciding run uses was the one no leg tested,
  # so a 3.14-only regression would have been found by the owner and by nothing before him.
  #
  # 3.12 stays the primary because mypy is pinned to 3.11 semantics and the lint/type legs belong on
  # a stable pair; 3.14 runs the SUITE, which is the part the owner's run exercises. `fail-fast` is
  # off so a 3.14 break does not hide a 3.12 one, or the reverse.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0   # #278, D-192 clause 2: wave-check reads each close's range, #272 a record's age
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install
        # D-177 (#81): the locked versions and build backend, hash-checked, then the project with nothing
        # resolved or fetched -- what `make install` takes.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/dev.lock -r requirements/build.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Lint (ruff)
        if: matrix.python-version == '3.12'
        run: ruff check src tests scripts   # W-108: the scope `make lint` checks
      - name: Type check (mypy strict)
        if: matrix.python-version == '3.12'
        run: mypy src
      - name: Test (pytest + coverage), offline (#122)
        # A network namespace with only loopback up: every child the suite starts is offline too.
        # The run says it must be, so a namespace that did not take stops it before any test.
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && exec sudo --preserve-env -u "$1" env "PATH=$2" MODEL_RANKING_REQUIRE_OFFLINE=1 pytest' sh "$USER" "$PATH"
      # v5.2 (17-3 / 15-6). A green job is not a run that verified anything. In the field, 214
      # contract tests skipped on every PR because the job had no `services:` block, and the board
      # stayed green -- in the same commit whose practices.md said "a skip is not a pass".
      # This reads the report the run produced. It does NOT close condition 15-8, which is open on
      # "nothing in GP inspects a real CI run"; six seats made that a condition of adopting it.
      - name: Skip budget (a skip is not a pass)
        run: python3 scripts/coverage_floor.py --junit .pytest-report.xml
      # model_ranking (D-155). The project's own legs of `make check`, which caller-liveness found had
      # no CI caller. `client_decl_gate.py` needs Xcode and says SKIPPED NO-ENVIRONMENT here, loudly;
      # `swift-test` is not run on Linux at all (the Engine imports NaturalLanguage) and stays an
      # owner-machine leg, as W-111 records.
      - name: Per-module coverage floor (W-041)
        run: python scripts/module_coverage_floor.py
      - name: Every wave-close record, not only the one named (V3C-69)
        run: python scripts/wave_check_all.py
      - name: Client privacy declarations (D-126, W-122) -- SKIPPED loudly without Xcode
        run: python scripts/client_decl_gate.py

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install pip-audit
        run: pip install pip-audit
      # v4.3.2 REPAIR. An earlier edit removed the two governance steps from this job and left their
      # `run:` key behind. YAML folded the orphan into the step ABOVE it, so this step was named
      # "Run pip-audit" and executed `check_records.py`. **The dependency audit had not run at all**,
      # and the job was green. Found by an external reviewer who parsed the YAML instead of reading it.
      # Verified by `conformance/test-ci-yaml.py`, which asserts every step's name matches its command.
      # D-177 and the M18 closure (#81): the audit reads every hash-checked lock under requirements/, the
      # exact versions that install, extras included -- `pip-audit .` read only `[project].dependencies`
      # and lost pyarrow when it moved to the `ingest` extra. `--disable-pip` audits the locks as written,
      # so nothing is installed first; this is `make deps`, and no lock fails closed.
      - name: Run pip-audit
        run: |
          locks=$(ls requirements/*.lock 2>/dev/null) || true
          [ -n "$locks" ] || { echo "::error::no lock under requirements/ -- pip-audit would read nothing"; exit 1; }
          pip-audit --strict --disable-pip $(printf -- '-r %s ' $locks)

  # v4.3 REPAIR (auditor B3). These two legs used to be STEPS inside `dep-audit`, downstream of
  # `pip-audit --strict`. The comment called them unconditional; they were conditional on the step
  # above them, and the only status name a maintainer could protect was `dep-audit`. That is the
  # "a skipped required job reports SUCCESS" defect relocated one level down. Own job, no `if:`,
  # no `continue-on-error`, and a NAME worth adding to branch protection.
  install-and-governance:
    name: install-and-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      # D-155. `conformance/test-ci-yaml.py` falls back to a minimal parser without PyYAML, and that
      # parser crashes (exit 1, no output) on this file's test matrix `python-version: [...]`.
      # Reported to DevFlow (field finding A12); here the real parser is simply installed.
      - name: Governance dependencies (PyYAML for the workflow conformance check)
        run: python -m pip install "PyYAML>=6.0"
      - name: Install completeness (M1/M2/M3)
        run: python3 scripts/check_records.py --install .
      - name: Governance records (R/X/P/N/C1 -- only on paths named in .governed-records; C2/L1/M3 always)
        run: python3 scripts/check_records.py
      - name: Validator is not a no-op (V4C-32)
        run: python3 scripts/check_records.py --self-test
      - name: Conformance -- every gate rejects what it must (V4C-80)
        run: python3 conformance/run-all.py
      # v5.2, found by condition 16-8's caller-liveness check ON ITS FIRST RUN. `slopsquat` is a leg
      # of `make gate` -- the name this package says means "everything we claim" -- and it appeared
      # in no workflow and in no pre-commit hook. Its only caller was someone who already knew its
      # name, which is the founding defect of this lineage, shipped for a fifth time at a fifth
      # altitude. The check that caught it was written to catch exactly this and caught it immediately.
      - name: Slopsquat -- declared deps exist on PyPI and are not brand new (F.8)
        run: python3 scripts/slopsquat_check.py
      # v5.2, 18-B(iv) (Increment 18). `harvest-context-check` is a leg of `make check` and had no
      # CI caller anywhere -- the Security seat found it at Increment 17 and caller-liveness could
      # not see it, because the check passed a leg when ANY ONE of its transitive tokens appeared.
      # `ruff` was vouching for it. In an installation this step reports SKIPPED and exits 0, which
      # is correct: a project maintains no control roster. It is here so the leg has a caller.
      # B8, Increment 19 council (DevOps seat). This step did not exist, and nothing anywhere
      # ran `shell_dialect_check.sh` -- not CI, not pre-commit, not the hook config. Condition
      # 15-12's gate was adopted at Increment 18, is a leg of `make check` and therefore of
      # `make gate`, and had no caller in the template a project receives. `caller-liveness`
      # could not see it because its token extractor matched `.py` only (TB-101); the moment
      # that was repaired, the finding appeared -- and a second defect in the same function,
      # a `make check` mentioned in comment PROSE, swallowed it again.
      - name: Shell dialect -- every shipped .sh parses and declares one dialect (15-12)
        run: bash scripts/shell_dialect_check.sh
      - name: Harvest context is current (16-2)
        run: make harvest-context-check

