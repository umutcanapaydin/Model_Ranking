name: Issue agent

# Layer 2 (CI-triggered agent) of the issue model in .agents/rules/issues.md. Hardened YAML.
#
# SHIPS SWITCHED OFF (v7.2). In three field projects it ran about 550 times and never once finished:
# no repository had the ANTHROPIC_API_KEY secret, and its tools did not allow a commit or a push. It now
# runs only when started by hand (Actions -> Issue agent -> Run workflow, with the issue number and
# the lane). To switch the label trigger on, add the secret, then uncomment the `issues:` block under
# `on:` -- an owner's edit, like every workflow change.
#
# What each label does:
#   1. `agent:triage` — the agent only comments (triage verdict); no code, no PR.
#   2. `agent:fix`    — the agent runs /fix-issue and leaves a DRAFT PR. It never merges.
#   Apply `agent:fix` only once the triage verdict says the fix is safe to automate.
#   See .agents/rules/issues.md for the lifecycle this follows.
#
# Safety rails:
#   - Label-gated: only fires on agent:triage or agent:fix
#   - Draft PR only; a human marks it ready and merges. Branch protection requires a pull request to main,
#     with 0 required approvals (#31, docs/branch-protection.md): it is that rule, and this agent's token
#     holding no merge step, not an approval count, that keeps it from merging its own work (#81).
#   - Least-privilege token (contents/issues/pull-requests: write; nothing else)
#   - Timeout-capped (20 min per run)
#   - Concurrency cancel (newer event cancels stale runs on same issue)
#   - Every action pinned to a commit SHA (`bash scripts/pin-actions.sh` to move one)

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "the issue number"
        required: true
      lane:
        description: "triage (comment only) or fix (a draft PR)"
        required: true
        default: triage
  # issues:
  #   types: [opened, labeled]

permissions:
  # A CI agent on a draft PR it cannot merge is a different trust boundary from an agent in the
  # owner's sandbox, so it keeps commit rights -- and it commits as the machine identity below, so
  # no agent commit can be mistaken for a person's.
  contents: write          # create a fix/issue-* branch + commits; NEVER main (branch protection)
  pull-requests: write     # open a DRAFT PR only -- it cannot merge its own work
  issues: write            # comment + label
  # Explicitly NOT granting: actions, packages, security-events, deployments

concurrency:
  group: issue-agent-${{ inputs.issue || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  agent:
    # Gate: a run started by hand, or (once the label trigger is on) a label. Default-off prevents
    # firing on every drive-by issue.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'agent:triage') || contains(github.event.issue.labels.*.name, 'agent:fix')
    runs-on: ${{ vars.DEVFLOW_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    # The machine identity every automated commit carries. `conformance/test-commit-identity.py`
    # knows it by this address; any other identity on a branch is refused as a stranger's.
    env:
      GIT_AUTHOR_NAME: gp-agent
      GIT_AUTHOR_EMAIL: gp-agent@users.noreply.github.com
      GIT_COMMITTER_NAME: gp-agent
      GIT_COMMITTER_EMAIL: gp-agent@users.noreply.github.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Headless, every tool outside this list is refused: the fix lane needs to commit, push and
          # open the draft. The Bash guard (.claude/settings.json) still judges each command.
          claude_args: >-
            --allowedTools "Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git fetch:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(make:*),Read,Edit,Write,Grep,Glob"
          prompt: |
            Route by lane (a run started by hand) or by label:
            - Lane `fix`, or label `agent:fix`: run the /fix-issue skill. It ends by running
              /pre-merge and leaves a DRAFT pull request; a human marks it ready and merges.
            - Lane `triage`, or label `agent:triage`: run the /triage-issue skill (comment only, no code).

            Constraints (NON-NEGOTIABLE):
            - Read .agents/rules/issues.md and .agents/rules/practices.md before any action; the skill
              names anything else it needs
            - Branch naming: fix/issue-<number>-<slug>
            - Never edit main
            - Never force-push
            - Never --no-verify
            - PR opened MUST be DRAFT (gh pr create --draft)
            - PR body MUST cite file:line evidence for each acceptance criterion (per permission-matrix §11)
            - Touch only files relevant to the issue (no scope sprawl)

            Issue number: ${{ inputs.issue || github.event.issue.number }}
            Lane: ${{ inputs.lane || 'by label' }}

# Host-side admin TODOs (one-time, requires admin):
#   1. Add ANTHROPIC_API_KEY to repo secrets (masked + protected)
#   2. Create the label vocabulary once: `make labels` (reads .agents/rules/issues.md, creates
#      only the missing labels, touches none that exist)
#   3. Branch protection on main:
#      - Require the status checks docs/branch-protection.md lists (the one list)
#      - Require pull request reviews: 1+ (human required)
#      - Restrict who can push to matching branches
#   4. Set 90-day rotation reminder for ANTHROPIC_API_KEY
#   5. Monthly cost cap monitoring (cost-anomaly alarm at >2x daily baseline)

# Commits from this workflow carry the machine identity set in the job env and NO AI attribution
# (no Co-Authored-By, no "Generated with"). `conformance/test-git-authority.py` asserts both.
#
# model_ranking (D-155 clause 2, D-161): the owner kept the trailer, so every commit this workflow
# produces must also carry the trailer below. `conformance/test-git-authority.py` asserts it, because
# a policy that lives only in a comment is a policy nobody enforces.
#
#   GP-Agent: issue-agent (Layer 2, draft PR, cannot merge)
