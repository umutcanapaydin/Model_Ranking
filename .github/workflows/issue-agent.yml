name: Issue agent

# Pipeline v2.0 — Layer 2 (CI-triggered agent) per consortium 3-layer model.
# Hardened YAML per DevOps lens.
#
# IMPORTANT: This workflow ships in SHADOW MODE for the first milestone:
#   1. Agent only comments on issues (does not open PRs) — manual review of every comment.
#   2. Graduate to draft-PR mode after 1 full milestone of successful shadow-mode runs.
#   3. See pipeline-design.md §4 (Issue Management) for the rollout sequence.
#
# Safety rails (all consortium-locked):
#   - Label-gated: only fires on agent:triage or agent:fix
#   - Draft PR only (cannot self-merge; branch protection on main enforces)
#   - Least-privilege token (contents/issues/pull-requests: write; nothing else)
#   - Timeout-capped (20 min per run)
#   - Concurrency cancel (newer event cancels stale runs on same issue)
#   - Pinned action SHAs (replace @v1-style refs with SHAs before going live)

on:
  issues:
    types: [opened, labeled]

permissions:
  # v4.3.2. `AGENTS.md` said "agents NEVER run git" while this file granted commit rights. The
  # contradiction was real but the resolution is not to revoke this: a CI agent on a draft PR it cannot
  # merge is a DIFFERENT trust boundary from an agent in the owner's sandbox. What was missing is
  # ATTRIBUTION -- in the field one agent commit carried the owner's own identity and nothing
  # distinguished it. GDF solved this with a machine account and required trailers a week earlier;
  # GP had neither. Both are below.
  contents: write          # create a fix/issue-* branch + commits; NEVER main (branch protection)
  pull-requests: write     # open a DRAFT PR only -- it cannot merge its own work
  issues: write            # comment + label
  pull-requests: write     # open the draft PR
  # Explicitly NOT granting: actions, packages, security-events, deployments

concurrency:
  group: issue-agent-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  agent:
    # Gate: only run when a label exists. Default-off prevents firing on every drive-by issue.
    if: contains(github.event.issue.labels.*.name, 'agent:triage') || contains(github.event.issue.labels.*.name, 'agent:fix')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_AUTHOR_NAME: gp-issue-agent
      GIT_AUTHOR_EMAIL: gp-issue-agent@users.noreply.github.com
      GIT_COMMITTER_NAME: gp-issue-agent
      GIT_COMMITTER_EMAIL: gp-issue-agent@users.noreply.github.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # TODO: pin the Claude Code action version to a commit SHA, not @v1
      #   Get latest tag SHA: gh api repos/anthropics/claude-code-action/git/refs/tags/v1 -q .object.sha
      - uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Route by label:
            - If this issue has label `agent:fix`, run the /fix-issue-prepare skill FIRST,
              then (only if prepare succeeds) run /fix-issue-implement.
            - Else if `agent:triage`, run the /triage-issue skill (comment only, no code).

            Constraints (NON-NEGOTIABLE):
            - Read .agents/rules/ and permission-matrix.md before any action
            - Branch naming: fix/issue-<number>-<slug>
            - Never edit main
            - Never force-push
            - Never --no-verify
            - PR opened MUST be DRAFT (gh pr create --draft)
            - PR body MUST cite file:line evidence for each acceptance criterion (per permission-matrix §11)
            - Touch only files relevant to the issue (no scope sprawl)

            Issue number: ${{ github.event.issue.number }}

# Host-side admin TODOs (one-time, requires admin):
#   1. Add ANTHROPIC_API_KEY to repo secrets (masked + protected)
#   2. Create labels: gh label create agent:triage --color FFA500 --description "Auto-triage by agent"
#                     gh label create agent:fix    --color 1F7A4D --description "Auto-fix by agent"
#                     gh label create auto:fix     --color CADCFC --description "PR opened by agent"
#   3. Branch protection on main:
#      - Require status checks: test, secret-scan, dep-audit, install-and-governance  # single source: docs/branch-protection.md
#      - Require pull request reviews: 1+ (human required)
#      - Restrict who can push to matching branches
#   4. Set 90-day rotation reminder for ANTHROPIC_API_KEY
#   5. Monthly cost cap monitoring (cost-anomaly alarm at >2x daily baseline)

# Every commit this workflow produces must carry the trailer below. `conformance/test-git-authority.py`
# asserts it, because a policy that lives only in a comment is a policy nobody enforces.
#
#   GP-Agent: issue-agent (Layer 2, draft PR, cannot merge)
