# Curated provider model ROSTERS (REQ-ING-009) — the second half of the moat.
#
# WHY THIS FILE EXISTS. A plan page that names no model cannot be ranked, and guessing is
# forbidden (M1 rule 4). Some providers publish the model list for a plan somewhere OTHER than
# the pricing page — a help-centre article, a plan detail page. That list is a SEPARATE source
# with its own URL and its own verification clock, and this file is it.
#
# RULES (same discipline as data/plans.yaml, D-107):
# - Only names a documented page states EXPLICITLY for THAT plan. No inference from an API
#   catalogue, no "the provider probably includes X".
# - Every roster carries source_url + last_verified (probe date). Stale rosters are disclosed.
# - A roster name links to a model only through the registry; unmatched names DROP and are counted.
# - A provider that publishes no per-plan list gets NO roster entry — its plans stay unscored and
#   the coverage metric says so. That is the honest outcome, not a gap to paper over.
#
# PROBE LOG, 2026-08-15 (each URL fetched and read on this date):
# - Perplexity — help centre publishes a per-tier model table: PUBLISHED, curated below.
# - Anthropic — support.claude.com "What is the Pro plan?" and "What is the Max plan?" name NO
#   models; claude.com/pricing names models only in the API-pricing and legacy sections, which is
#   not a statement about consumer plan inclusion. NO ROSTER. Claude Pro/Max therefore remain
#   unscoreable, by evidence rather than by omission.
# - OpenAI — help.openai.com "What is ChatGPT Plus?" names no models and directs users to the
#   in-product model picker ("Model availability changes during rollouts"). NO ROSTER. ChatGPT
#   Go/Plus keep only what chatgpt.com/pricing itself names.
# - Google — one.google.com/about/google-ai-plans already names models on the plan page itself,
#   so no separate roster is needed.
#
# PROBE LOG, 2026-09-23: Perplexity's table changed (Gemini 3.1 Pro -> Gemini 3.7 Flash, GLM 5.2
# -> GLM 5.3, Grok 4.5 -> Grok 4.6 on both plans; the Max-only rows are still GPT-5.6 Sol and
# Claude Opus 5). Read through the r.jina.ai reader, since a direct fetch got HTTP 403.

schema: 1
staleness_days: 30   # same window as the plan table (owner Q3, 2026-08-15)

rosters:
  - plan_id: perplexity-pro
    provider: Perplexity
    source_url: https://www.perplexity.ai/help-center/en/articles/10354919-what-advanced-ai-models-are-included-in-my-subscription
    last_verified: 2026-09-23
    scope: search-models
    note: >-
      Transcribes the "Advanced models available in Search -> Pro and Max plans" table,
      Pro column, and NOTHING ELSE on that page (a snapshot "as of September 4, 2026").
      Until 2026-09 the page also had a "Computer Orchestrator Models" section that
      contradicted the Search table; it is gone, and Computer now points to its own article
      with its own availability rules. We transcribe the SEARCH tier because that is the
      surface a "which subscription should I buy for everyday questions" answer is about. Recorded as `scope` in DATA rather than prose so the choice is
      auditable — review MINOR-1. Sonar 2, Nemotron 3 Ultra and Kimi K3 are listed by the
      page but have no registry rule (no price, or no benchmark presence): they drop and
      are counted, like any other name.
    models:
      - Sonar 2
      - GPT-5.6 Terra
      - Gemini 3.7 Flash
      - Claude Sonnet 5
      - Kimi K3
      - GLM 5.3
      - Grok 4.6
      - Nemotron 3 Ultra

  - plan_id: perplexity-max
    provider: Perplexity
    source_url: https://www.perplexity.ai/help-center/en/articles/10354919-what-advanced-ai-models-are-included-in-my-subscription
    last_verified: 2026-09-23
    scope: search-models
    note: >-
      Same table, Max column: everything in Pro plus the two Max-only entries
      (GPT-5.6 Sol, Claude Opus 5). Same scope rule as the Pro roster above.
    models:
      - Sonar 2
      - GPT-5.6 Terra
      - GPT-5.6 Sol
      - Gemini 3.7 Flash
      - Claude Sonnet 5
      - Claude Opus 5
      - Kimi K3
      - GLM 5.3
      - Grok 4.6
      - Nemotron 3 Ultra
