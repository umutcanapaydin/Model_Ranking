    source_url: https://chatgpt.com/pricing/
    last_verified: 2026-09-23

  - id: claude-pro
    provider: Anthropic
    name: Claude Pro
    monthly_usd: 20.0
    currency: USD
    region: US
    limits: >-
      Everything in Free, plus more usage; includes Claude Code, Claude Design, Slides and
      Docs, and Claude in Chrome. $17/month billed annually ($200 up front), $20
      month-to-month. Plan cards name no specific model versions (model names appear elsewhere on the page — owner re-verifies at the gate).
    included_models: []
    source_url: https://claude.com/pricing
    last_verified: 2026-09-23

  - id: claude-max
    provider: Anthropic
    name: Claude Max
    monthly_usd: 100.0
    currency: USD
    region: US
    limits: >-
      From $100/month. Everything in Pro, plus choose 5x or 20x more usage than Pro;
