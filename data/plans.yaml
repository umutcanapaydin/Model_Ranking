    source_url: https://one.google.com/about/google-ai-plans/
    last_verified: 2026-08-15

  - id: perplexity-pro
    provider: Perplexity
    name: Perplexity Pro
    monthly_usd: 20.0
    currency: USD
    region: US
    limits: >-
      Premium model picker routing to frontier models from OpenAI, Anthropic and Google
