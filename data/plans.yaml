# Curated subscription-plan table (REQ-SUB-001/-002) — THE MOAT.
#
# RULES (m3-plan.md, D-107 candidate):
# - Every value is probed against a live source ON THE DAY it is entered; last_verified = probe date.
# - `limits` is what the page states, quoted/condensed faithfully — never our interpretation.
# - `included_models` lists ONLY model names a page states EXPLICITLY. Vague claims ("latest models",
#   "frontier models") stay in `limits` as text and produce NO model links (M1 rule 4: never guess).
# - USD / US region first (owner Q2, 2026-08-15). No currency conversion, ever.
# - Free tiers are out of scope (schema CHECK monthly_usd > 0): the product answers a purchase question.
# - A price the sources DISPUTE does not enter this table. RESOLVED at M4-W4 (REQ-SUB-006):
#     Google AI Plus was withheld at M3 over $4.99 vs $7.99. Re-probed 2026-08-15 — the two figures
#     are not a disagreement but a BEFORE and AFTER: $7.99 was the US launch price, cut to $4.99 on
#     2026-06-08, reported the same day by four independent outlets (9to5google, TechRepublic,
#     Engadget, Digital Trends) and still quoted as current by two price trackers. Entered below.
#
# Verification evidence, 2026-08-15 (owner re-verifies out-of-sandbox at the milestone gate):
# - chatgpt.com/pricing renders plan names/features but not USD amounts in our fetch; amounts
#   cross-checked against two independent 2026 trackers (fritz.ai/chatgpt-pricing, updated 2026-07-14;
#   felloai.com/chatgpt-pricing-guide..., updated 2026-04-24) — both agree: Go $8, Plus $20,
#   Pro from $100 (a $200 higher tier exists; split dated 2026-04-09).
# - claude.com/pricing rendered fully: Pro $20 month-to-month / $17 annual; Max from $100.
# - one.google.com/about/google-ai-plans renders features but not amounts; amounts cross-checked
#   (costbench.com, verified 2026-05-27; felloai.com/gemini-pricing) — both agree: Pro $19.99,
#   Ultra from $99.99.
# - Google AI Plus $4.99 (entered 2026-08-15, REQ-SUB-006). Same page, same rendering limit, so the
#   amount rests on named sources: FOUR launch-day reports of the 2026-06-08 cut — 9to5google
#   ("Google AI Plus drops to $4.99/month"), TechRepublic, Engadget, Digital Trends — plus two price
#   trackers still quoting $4.99 as current: costbench.com (verified 2026-05-27, $7.99, i.e. PRE-cut,
#   which is what produced the M3 "dispute") and felloai.com/gemini-pricing (updated 2026-06-11,
#   $4.99, POST-cut). The two trackers do not disagree; they are dated either side of one price
#   change. The row's `included_models` (Gemini 3.1 Pro) comes from the Google page itself, not the
#   trackers — an amount may be cross-checked, a model list may not (M1 rule 4).
# - Perplexity amounts cross-checked (felloai.com/perplexity-pricing, updated 2026-05-03): Pro $20,
#   Max $200 — unchanged, long-stable.
#
# Verification evidence, 2026-09-23 (owner re-verifies out-of-sandbox at the milestone gate):
# - Fetch path: a direct fetch got HTTP 403 from chatgpt.com, help.openai.com and perplexity.ai,
#   and one.google.com rendered for Turkey (Turkish text, TRY amounts), which is not US evidence.
#   The pages were read through the r.jina.ai reader (an English/USD render, no cache). A
#   third-party render does not prove the region.
# - chatgpt.com/pricing now RENDERS amounts: Go $8, Plus $20, Pro "From $100", cross-checked by
#   geotoolbox.ai/blog/chatgpt-pricing (updated 2026-09-07). Its "Compare features across plans ->
#   Models" table marks each model Yes/No per plan. **Owner ruling 2026-09-23: a row of that
#   table is an explicit statement** (translated from Turkish: "yes, the table counts"), so
#   `included_models` for the three ChatGPT plans transcribes it: every model marked Yes,
#   Expanded or Unlimited for that plan. Go's "GPT-5.6 Terra: Limited access in Work and Codex
#   on desktop" is a different product surface from the chat a plan answer is about, and is not
#   transcribed.
# - help.openai.com/en/articles/9793128: "As of September 10, 2026, we're temporarily pausing new
#   sign-ups and upgrades to the ChatGPT Pro $200 plan (Pro 20X)". Pro $100 is unaffected.
# - claude.com/pricing rendered fully: Pro $17 annual ($200 up front) / $20 monthly; Max from $100.
#   "Claude Cowork is now just Claude", so Cowork is no longer a Pro card item. The compare table
#   names model FAMILIES only (Fable/Opus/Sonnet/Haiku), not versions, so nothing links.
# - one.google.com/about/google-ai-plans still renders no amounts; cross-checked by
#   felloai.com/gemini-pricing (updated 2026-09-22) and suprmind.ai/hub/gemini/pricing (modified
#   2026-08-11): Plus $4.99, Pro $19.99, Ultra $99.99 (Ultra 20x $199.99). The Ultra card also
#   states "Higher access to Gemini 3 Pro in AI Mode", which the 2026-08-15 row missed.
# - Perplexity amounts cross-checked: felloai.com/perplexity-pricing (updated 2026-09-18) and
#   cloudzero.com/blog/perplexity-pricing (2026-09-21) both give Pro $20, Max $200. perplexity.ai/
#   did not render, so the Pro/Max `limits` rest on the help centre (article 11680686 for Max) and
#   the per-plan model table in data/rosters.yaml.

schema: 1
staleness_days: 30   # owner Q3 (2026-08-15): a row older than this is disclosed as stale
budget_caps_usd:     # monthly-USD tiers for --subscription (first calibration, M3-W3; data, not code)
  low: 10          # covers the $8 entry tier
  medium: 25           # covers the $19.99-20 flagship tiers
  unlimited: null     # uncapped by definition

plans:
  - id: chatgpt-go
    provider: OpenAI
    name: ChatGPT Go
    monthly_usd: 8.0
    currency: USD
    region: US
    limits: >-
      More messages with tools, more uploads, more image creation, more voice chats,
      longer memory; may include ads. The compare table marks every GPT-6 model "No" for Go.
    included_models:
      - GPT-5.6 Luna
      - GPT-5 Thinking Mini
    source_url: https://chatgpt.com/pricing/
    last_verified: 2026-09-23

  - id: chatgpt-plus
    provider: OpenAI
    name: ChatGPT Plus
    monthly_usd: 20.0
    currency: USD
    region: US
    limits: >-
      Advanced reasoning models with GPT-6; expanded messages and uploads; more complex
      and accurate image creation; expanded deep research; expanded memory and context.
      First tier that unlocks the GPT-6 models. GPT-5.6 Sol Pro is Pro-only.
    included_models:
      - GPT-6 Astra
      - GPT-6 Sol
      - GPT-6 Luna
      - GPT-5.6 Sol
      - GPT-5.6 Terra
      - GPT-5.6 Luna
      - GPT-5 Thinking Mini
    source_url: https://chatgpt.com/pricing/
    last_verified: 2026-09-23

  - id: chatgpt-pro
    provider: OpenAI
    name: ChatGPT Pro
    monthly_usd: 100.0
    currency: USD
    region: US
    limits: >-
      From $100/mo: 5x more usage; Pro reasoning powered by GPT-6 Astra; maximum Codex
      tasks; unlimited and faster image creation; maximum deep research; maximum memory and
      context. The $200/mo 20x tier is closed to new sign-ups since 2026-09-10
      (help.openai.com article 9793128).
    included_models:
      - GPT-6 Astra
      - GPT-6 Sol
      - GPT-6 Luna
      - GPT-5.6 Sol Pro
      - GPT-5.6 Sol
      - GPT-5.6 Terra
