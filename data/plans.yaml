  - id: google-ai-plus
    provider: Google
    name: Google AI Plus
    monthly_usd: 4.99
    currency: USD
    region: US
    limits: >-
      2x access to Gemini vs free; Gemini 3.1 Pro and Deep Research; 400 GB storage.
