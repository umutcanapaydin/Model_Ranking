    included_models: []
    source_url: https://claude.com/pricing
    last_verified: 2026-08-15

  - id: google-ai-plus
    provider: Google
    name: Google AI Plus
    monthly_usd: 4.99
    currency: USD
    region: US
    limits: >-
      2x access to Gemini vs free; Gemini 3.1 Pro and Deep Research; 400 GB storage.
      Price cut from $7.99 on 2026-06-08 (the M3 "dispute" was a stale figure, not a
