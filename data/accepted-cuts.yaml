# Cuts the owner accepted (D-220 clause 3, D-221): rows a declared board may lose without the D-164 guard
# counting them as lost. Each cut names its board, the ADR that accepted it (one `docs/decisions.md` holds),
# why, an `until:` date, and exactly the raw names it may lose. A lost row is excused only by its own name,
# never by its model's; any other row lost is judged as before. A cut past its `until:` date, or without
# one, fails the refresh. The refresh refuses a file that is not this schema
# (`app.workflows.refresh.parse_accepted_cuts`), and any change here goes to a security review
# (`scripts/review_need.py`, EXCEPTION_FILES).
#
# Retired (D-221 clause 1, #418): epoch_chess, Epoch's 2026-10 chess re-run, 94 names (D-220, #415). The Mac's
# artifact published that board on 2026-10-23 (`release-55cf42e`) and the hosted engine serves it since the
# v0.1.0 deploy (`release-2a68ca4`); the entry is in git at `bf278b0`.
#
# Re-spellings the owner accepted (D-228, #475): each old raw name -> its new one, on one board, under a cut's
# terms; the list is optional, `respellings:` beside `cuts:`. A pair is judged as the row it was only where it is
# a re-spelling and lists every name its model had on that board (#478).
#
# Retired (#477): text_to_image, LMArena's 2026-10-26 re-spelling, 27 pairs (D-228). The hosted nights of
# 2026-10-27 and 2026-10-28 published the new names, so the entry was inert; the entry is in git at `747b63c`.
#
# Retired (D-247 clause 2): image_to_video and text_to_video, LMArena's 2026-11-05 re-spelling, 14 and 16 pairs.
# The hosted night of 2026-11-06 (`release-756fcb3`) published the new names, so the entries were inert; they are
# in git at `756fcb3`.
cuts: []
# Additions the owner accepted (D-251, #605): raw names one board may gain without the growth guards (D-132, D-159)
# counting them as new, under a cut's terms; the list is optional, `additions:` beside `cuts:`. A name is judged as
# already seen only where it is new, and a model only when every name it has on that board is listed. Retire the
# entry once a night has published the names, before its `until:` date fails every night.
additions:
  - board: computer-use
    decision: D-251
    reason: >-
      Terminal-Bench 4.0's publisher merged a batch of submission files at once (measured 2026-11-11 against the
      served artifact of 2026-11-10, run 42751550585); the hosted night of 2026-11-11 refused them as 10 of 31 new
    until: 2026-11-25
    names:
      - anthropic/claude-haiku-5-5
      - meta/muse-wonder-1.0
      - moonshotai/kimi-k3.1-pro
      - openai/gpt-5.4-mini
      - openai/gpt-6.1-terra
      - openrouter/mistralai/mistral-large-4-0
      - openrouter/nvidia/nemotron-3.5-super-vl
      - openrouter/reflection/beam-1.0-501b-a23b
      - openrouter/thinkingmachines/inkling
      - openrouter/thinkingmachines/inkling-small
