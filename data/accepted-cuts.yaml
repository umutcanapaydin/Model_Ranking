# Cuts the owner accepted (D-220 clause 3): rows a declared board may lose without the D-164 guard
# counting them as lost. Each cut names its board, the ADR that accepted it, why, and exactly the raw
# names it may lose; any other row lost is judged as before. A cut has no effect once a refresh has
# published, since the served board then no longer holds those rows. The refresh refuses a file that
# is not this schema (`app.workflows.refresh.parse_accepted_cuts`).
