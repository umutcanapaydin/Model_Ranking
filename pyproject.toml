[project]
name = "model-ranking"
version = "0.1.0"
description = "LLM benchmark + pricing aggregation and deterministic recommendation engine"
readme = "README.md"
requires-python = ">=3.11"             # seed C.2: range, not point version
license = { text = "Proprietary" }

dependencies = [
    # ── add as needed; mirror in AGENTS.md §1 (seed C.4) ──
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # planned (add on first import — security review M1 MINOR-1):
    # pydantic-settings (K.2 config), structlog (JSON logging), orjson (API serving)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",  # `make test` runs the suite across every core (owner, 2026-09-20)
    "ruff==0.16.2",              # W-108: pinned; a newer ruff raised findings this one does not
    "black>=24.10",
    "mypy>=1.13",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
    "types-pyyaml>=6.0",
    # v2.0 security gates (Stage 2 internal commit-gate via hooks, F.6/F.7/F.8)
    "pip-audit>=2.7",  # dep CVE scan (F.7)
    # `conformance/test-ci-yaml.py` parses the workflows and exits 2 rather than reporting clean when
    # PyYAML is absent. Undeclared, `make gate` was unrunnable with only the system interpreter.
    "PyYAML>=6.0",
    # Note: gitleaks installed system-wide via brew/apt (not pip); see Makefile.
]

# ───── Tooling ─────

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]                  # seed H.6: src-layout discovery

[tool.ruff.lint]
# Turkish user-facing strings in the recommendation engine (D-104 explanations)
allowed-confusables = ["ı", "İ", "ş", "Ş", "ç", "Ç", "ö", "Ö", "ü", "Ü", "ğ", "Ğ"]
select = [
    "E", "F", "W",             # pycodestyle / pyflakes
    "I",                       # isort
    "B",                       # bugbear
    "UP",                      # pyupgrade
    "SIM",                     # simplify
    "RUF",                     # ruff
    "ASYNC",                   # async-misuse
    "S",                       # flake8-bandit (security)
    "PTH",                     # pathlib
    "C90",                     # mccabe complexity
]
ignore = [
    "S101",                    # asserts are fine in tests
    "E501",                    # line length handled by formatter
]

# M7 closure, W-026: `make lint` was widened from `src tests` to include `scripts/`, because the
# security ruleset (`S`, flake8-bandit) had never run on the L.8 deploy gate, the governance
# validator, or the supply-chain check. Widening it surfaced 12 findings; three were real and are
# fixed. The other nine are all `C901` in one file, and they are EXEMPTED here rather than
# refactored away.
#
# The reason, stated so this is a decision and not a silencing: `check_records.py` is a rules
# engine. R1-R3, X1-X3, C1/C2, L1, M1-M3 and D1 are each a branch, and `main` orchestrates all of
# them — the complexity number is a faithful description of what the file does, not a symptom.
# Splitting nine functions to satisfy a heuristic would touch the validator every governance record
# in this repository depends on, in exchange for a smaller number.
#
# **Only the complexity heuristic is exempted.** Every security, correctness and import rule still
# applies to `scripts/`, which is the half of this that was actually missing.
[tool.ruff.lint.isort]
known-first-party = ["app"]   # ◄── change if package renamed

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "C90"]
"scripts/wave_check.py" = ["C901"]      # same reason: one branch per V3C-69 row rule
# DevFlow v6.0 adoption (D-155). These files arrived from the methodology and are kept close to it,
# so the next DevFlow sync is a small three-way merge. What is exempted, and why, rule by rule:
#   S603/S607  the governance scripts call `git` (history, blobs, identity) with literal arguments
#   B023       check_records.py `_refs` is defined AND called inside the same loop turn -- read at
#              scripts/check_records.py `_refs`; the late-binding hazard the rule names cannot occur
#   S314       coverage_floor.py parses the JUnit report this repository's own pytest just wrote
#   RUF001     an en dash quoted inside a message that is ABOUT typography
#   C901       closure_check.py is a rules engine, the same reason as the two lines above
"scripts/check_records.py" = ["C901", "S603", "S607", "B023", "RUF001"]
"scripts/write_install_marker.py" = ["S603", "S607"]
"scripts/coverage_floor.py" = ["S314"]
"scripts/closure_check.py" = ["C901"]
# Customer-wire-format schemas may need camelCase (seed H.1):
# "src/<pkg>/schemas/**" = ["N815"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true                  # seed H.7: trust mypy narrowing
warn_unused_ignores = true     # seed C.8: unused type:ignore is a signal
warn_unreachable = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
# v5.2 (15-6 / 17-3). `--cov-fail-under` was missing for five versions: a fully-skipped run
# exited 0 and `make test` reported green, in the template handed to every project. The
# floor starts low on purpose -- a floor nobody can meet gets deleted, and a deleted floor
# is worth less than a low one. Raise it in the tree, where a reviewer sees the diff.
addopts = "-ra --strict-markers --strict-config --cov=src/app --cov-report=term-missing --cov-report=json --cov-fail-under=60 --junitxml=.pytest-report.xml"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/app"]           # ◄── change if package renamed

[tool.coverage.report]
# W-041. The permission matrix has always listed "coverage drop on a touched module" as BLOCKING
# and NOTHING computed it, which is how a new module -- the single reader behind six of the nine
# served surfaces -- reached a closing tree at 32% coverage with zero tests naming it, through a
# green gate, a wave close, a closure report and a self-run security review. Three independent
# reviewers found it in the same pass.
#
# 85 against a measured 88 is deliberately close: a floor with ten points of slack is a floor that
# never fires. Raising this number is the normal outcome of adding tests; LOWERING it is a decision
# that belongs in the ledger.
#
# This global figure is necessary and NOT sufficient -- 88% total is exactly what concealed the 32%
# module. `scripts/coverage_floor.py` is the per-module half, and it is the one that would have
# caught it.
fail_under = 85
show_missing = true
