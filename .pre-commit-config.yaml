# Pre-commit hooks — OPT-IN, defense-in-depth with CI.
# v2.0 consortium decision: opt-in only; mandate `pre-commit install` once per developer.
# Stack: Python (ruff + gitleaks + general hygiene). Adapt for Go/Rust/Node per ai-native.md §6.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0   # bump via `pre-commit autoupdate` after install
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
        # Uses .gitleaks.toml (committed) for project-specific allowlist.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

# To install (once per developer):
#   pipx install pre-commit
#   pre-commit install
#
# To run manually:
#   pre-commit run --all-files

  # v4.3 (V4C-78): these two had Makefile targets and NO caller — not here, not in CI, not in
  # `make check`. A gate nothing invokes is Tier 0 whatever its exit code does.
  - repo: local
    hooks:
      - id: check-records
        name: governance records are valid (V4C-30 · C2/L1 always; R/X/P/N/C1 only on paths you name in .governed-records; D1/M3 are GP-repo rules)
        entry: python3 scripts/check_records.py
        language: system
        pass_filenames: false
      - id: install-check
        name: this tree is a complete install (V4C-72/76 · M1/M2)
        entry: bash -c 'python3 scripts/check_records.py --install .'
        language: system
        pass_filenames: false
      - id: conformance
        name: conformance -- every gate rejects what it must (V4C-80)
        entry: python3 conformance/run-all.py
        language: system
        pass_filenames: false
        always_run: true
