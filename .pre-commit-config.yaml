# Pre-commit hooks — OPT-IN, defense-in-depth with CI.
# v2.0 consortium decision: opt-in only; mandate `pre-commit install` once per developer.
# Stack: Python (ruff + gitleaks + general hygiene). Adapt for Go/Rust/Node per ai-native.md §6.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0   # bump via `pre-commit autoupdate` after install
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
        # Uses .gitleaks.toml (committed) for project-specific allowlist.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

# To install (once per developer):
#   pipx install pre-commit
#   pre-commit install
#
# To run manually:
#   pre-commit run --all-files
